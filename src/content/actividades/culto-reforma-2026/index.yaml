titulo: Culto de Acción de Gracias por la Reforma
fecha: 2026-11-01T11:00:00-03:00
categoria: Especial
lugar: Templo — Alberto Llona 456, Maipú
resumen: Damos gracias a Dios por la Reforma protestante y por la fe que, por su gracia, hemos recibido.
descripcion: |-
  Cada año recordamos el 31 de octubre de 1517 como el inicio de la Reforma protestante. En este culto daremos gracias a Dios por haber devuelto la Escritura al centro de la vida de su Iglesia.

  Después del culto compartiremos un almuerzo de camaradería. ¡Trae a tu familia!
publicado: true
