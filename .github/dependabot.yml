version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'vitest', 'globals']
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    labels: [dependencias, ci]
